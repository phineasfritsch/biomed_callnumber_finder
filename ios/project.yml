# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate
#
# A generated project beats a checked-in .xcodeproj here: project.pbxproj is unreviewable in a
# diff and merge-hostile, and this file is neither.

name: BiomedShelfScanner
options:
  bundleIdPrefix: com.biomedshelf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # ← your Apple Developer team ID, for device builds
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Deliberately NOT `complete` yet. FrameProcessor's @unchecked Sendable is a reasoned claim
    # (AVCaptureVideoDataOutput serialises its delegate callbacks), but strict checking on a
    # first build buries the real errors under concurrency noise. Raise this to `complete` once
    # the app runs — the design is written to satisfy it.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  BiomedShelfScanner:
    type: application
    platform: iOS
    sources:
      - path: BiomedShelfScanner
        # Info.plist is referenced via INFOPLIST_FILE below. Left in `sources` it would ALSO be
        # copied into the Resources build phase, which Xcode rejects ("Multiple commands produce
        # .../Info.plist"). Resources/*.json is picked up automatically by this same glob — do not
        # add a separate `resources:` key for it or you get the same duplicate-output failure.
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biomedshelf.scanner
        INFOPLIST_FILE: BiomedShelfScanner/Info.plist
        # Compiles Assets.xcassets/AppIcon.appiconset into the bundle. The catalog holds a single
        # 1024x1024 (Xcode 14+ single-size); Xcode derives every size from it, including the
        # 120x120 that upload validation (error 90022) checks for. Pairs with CFBundleIconName
        # in Info.plist — hand-written plists don't get that key injected for free.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Portrait only. This is a one-handed tool used while pushing a cart; there is no
        # landscape story worth the layout cost.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # No camera in the Simulator, and the app is built to degrade gracefully — see the note
        # in Info.plist about why UIRequiredDeviceCapabilities is absent.

  BiomedShelfScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Picks up both the .swift tests and the .json golden fixtures. Again: no separate
      # `resources:` key, or the fixtures get copied twice.
      - path: Tests
    dependencies:
      - target: BiomedShelfScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
