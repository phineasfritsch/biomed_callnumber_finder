# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate
#
# A generated project beats a checked-in .xcodeproj here: project.pbxproj is unreviewable in a
# diff and merge-hostile, and this file is neither.

name: BiomedShelfScanner
options:
  bundleIdPrefix: com.biomedshelf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # ← your Apple Developer team ID, for device builds
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Concurrency in this project is deliberate (FrameProcessor is @unchecked Sendable for a
    # stated reason). Complete checking keeps that honest rather than accidental.
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  BiomedShelfScanner:
    type: application
    platform: iOS
    sources:
      - path: BiomedShelfScanner
    resources:
      - path: BiomedShelfScanner/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biomedshelf.scanner
        INFOPLIST_FILE: BiomedShelfScanner/Info.plist
        # Portrait only. This is a one-handed tool used while pushing a cart; there is no
        # landscape story worth the layout cost.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  BiomedShelfScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    resources:
      # The golden fixture is generated from the working JS comparator — see Tests/CallNumberTests.
      - path: Tests/CallNumberGolden.json
    dependencies:
      - target: BiomedShelfScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
